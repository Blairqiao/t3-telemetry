[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "t3-telemetry"
version = "0.1.0"
description = "Terminal telemetry dashboard and CLI for T3 Code and Antigravity"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich>=13.9.0",
]

[project.scripts]
t3-top = "t3_telemetry.cli:_entrypoint"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/t3_telemetry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".worktrees", ".agent-docs", ".git", ".venv"]
